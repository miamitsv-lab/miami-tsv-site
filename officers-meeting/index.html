<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#0b4f96" />
  <title>Meeting of All Officers</title>
  <style>
    * { box-sizing: border-box; }

    html,
    body {
      width: 100%;
      height: 100%;
      margin: 0;
    }

    body {
      overflow: hidden;
      background: #eef7fc;
      font-family: Arial, Helvetica, sans-serif;
    }

    .stage {
      position: relative;
      width: 100vw;
      height: 100vh;
      height: 100svh;
      overflow: hidden;
      background: #eef7fc;
    }

    /* Blurred copy fills any unused space around the full poster. */
    .poster-bg {
      position: absolute;
      inset: -32px;
      width: calc(100% + 64px);
      height: calc(100% + 64px);
      object-fit: cover;
      object-position: center;
      filter: blur(28px);
      transform: scale(1.06);
      opacity: 0.9;
      user-select: none;
      -webkit-user-drag: none;
      pointer-events: none;
    }

    /* Main image is never cropped. */
    .poster {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      display: block;
      object-fit: contain;
      object-position: center;
      user-select: none;
      -webkit-user-drag: none;
    }
  </style>
</head>
<body>
  <main class="stage">
    <picture aria-hidden="true">
      <source media="(max-width: 600px) and (orientation: portrait)" srcset="image-mobile.jpg" />
      <source media="(max-width: 1100px) and (orientation: portrait)" srcset="image-tablet.png" />
      <img class="poster-bg" src="image-desktop.png" alt="" />
    </picture>

    <picture>
      <source media="(max-width: 600px) and (orientation: portrait)" srcset="image-mobile.jpg" />
      <source media="(max-width: 1100px) and (orientation: portrait)" srcset="image-tablet.png" />
      <img
        class="poster"
        src="image-desktop.png"
        alt="Meeting of All Officers — Friday, September 18, 2026 at 9:00 PM via Webex. We encourage everyone to join in our short meeting."
      />
    </picture>
  </main>
</body>
</html>
