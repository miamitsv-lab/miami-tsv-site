<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#0b4f96" />
  <title>Meeting of All Officers</title>
  <style>
    * { box-sizing: border-box; }
    html, body { width: 100%; height: 100%; margin: 0; }
    body {
      overflow: hidden;
      background: #eef7fc;
      font-family: Arial, Helvetica, sans-serif;
    }
    .poster {
      width: 100vw;
      height: 100vh;
      height: 100svh;
      display: block;
      object-fit: cover;
      object-position: center;
      user-select: none;
      -webkit-user-drag: none;
    }
  </style>
</head>
<body>
  <picture>
    <source media="(max-width: 600px) and (orientation: portrait)" srcset="image-mobile.jpg" />
    <source media="(max-width: 1100px) and (orientation: portrait)" srcset="image-tablet.png" />
    <img
      class="poster"
      src="image-desktop.png"
      alt="Meeting of All Officers — Friday, September 18, 2026 at 9:00 PM via Webex. We encourage everyone to join in our short meeting."
    />
  </picture>
</body>
</html>
