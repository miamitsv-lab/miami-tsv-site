<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#ffffff">
  <meta name="description" content="Happy 112th Anniversary — Iglesia Ni Cristo (Church of Christ)">
  <title>Happy 112th Anniversary</title>

  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      min-height: 100%;
      margin: 0;
      background: #ffffff;
    }

    body {
      min-height: 100svh;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow-x: hidden;
      font-family: Arial, Helvetica, sans-serif;
    }

    .anniversary-page {
      width: 100%;
      min-height: 100svh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #ffffff;
    }

    .anniversary-image {
      display: block;
      width: 100%;
      height: auto;
      max-width: 1920px;
      object-fit: contain;
      object-position: center;
    }

    /* Desktop and landscape displays */
    @media (min-width: 901px) {
      .anniversary-image {
        width: min(100vw, 1920px);
        max-height: 100svh;
      }
    }

    /* Tablets */
    @media (min-width: 601px) and (max-width: 900px) {
      .anniversary-page {
        padding: 0;
      }

      .anniversary-image {
        width: 100%;
        max-height: 100svh;
      }
    }

    /* Mobile phones */
    @media (max-width: 600px) {
      body {
        align-items: flex-start;
      }

      .anniversary-page {
        min-height: 100svh;
        padding: 0;
      }

      .anniversary-image {
        width: 100%;
        min-height: 100svh;
        object-fit: contain;
        object-position: center;
      }
    }
  </style>
</head>
<body>
  <main class="anniversary-page">
    <img
      class="anniversary-image"
      src="anniversary-112.png"
      alt="Happy Anniversary, 112 Years, 1914 to 2026, Iglesia Ni Cristo, Church of Christ">
  </main>
</body>
</html>
