<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport"
        content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#07101c">

  <title>Unity Games — Miami Neon</title>
  <meta name="description" content="Unity Games promotional page in Miami neon colors.">

  <link rel="preload"
        as="image"
        href="images/unity-games-mobile.png"
        media="(max-width: 599px)">
  <link rel="preload"
        as="image"
        href="images/unity-games-tablet.png"
        media="(min-width: 600px) and (max-width: 1199px)">
  <link rel="preload"
        as="image"
        href="images/unity-games-desktop.png"
        media="(min-width: 1200px)">

  <style>
    :root {
      color-scheme: dark;
      background: #07101c;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      background: #07101c;
    }

    body {
      min-height: 100vh;
      min-height: 100svh;
      min-height: 100dvh;
      font-family: Arial, Helvetica, sans-serif;
    }

    .poster-page {
      position: fixed;
      inset: 0;
      display: grid;
      place-items: center;
      overflow: hidden;
      background: #07101c;
      isolation: isolate;
    }

    .poster {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      display: block;
    }

    .poster img {
      display: block;
      width: 100%;
      height: 100%;
      user-select: none;
      -webkit-user-drag: none;
    }

    .poster--background {
      z-index: -2;
      inset: -5%;
      width: 110%;
      height: 110%;
      opacity: 0.78;
      filter: blur(34px) brightness(0.48) saturate(1.08);
      transform: scale(1.06);
    }

    .poster--background img {
      object-fit: cover;
      object-position: center;
    }

    .poster-page::after {
      content: "";
      position: absolute;
      inset: 0;
      z-index: -1;
      pointer-events: none;
      background:
        linear-gradient(
          to bottom,
          rgba(0, 0, 0, 0.08),
          rgba(0, 0, 0, 0.01) 48%,
          rgba(0, 0, 0, 0.13)
        );
    }

    .poster--foreground {
      z-index: 1;
      padding:
        env(safe-area-inset-top)
        env(safe-area-inset-right)
        env(safe-area-inset-bottom)
        env(safe-area-inset-left);
    }

    .poster--foreground img {
      object-fit: contain;
      object-position: center;
    }

    @media (prefers-reduced-motion: no-preference) {
      .poster--foreground {
        animation: poster-reveal 420ms ease-out both;
      }

      @keyframes poster-reveal {
        from {
          opacity: 0;
          transform: scale(1.006);
        }
        to {
          opacity: 1;
          transform: scale(1);
        }
      }
    }

    @media print {
      html,
      body {
        overflow: visible;
        background: #fff;
      }

      .poster-page {
        position: relative;
        min-height: 100vh;
      }

      .poster--background,
      .poster-page::after {
        display: none;
      }
    }
  </style>
</head>

<body>
  <main class="poster-page"
        aria-label="Unity Games promotional announcement">

    <picture class="poster poster--background" aria-hidden="true">
      <source media="(max-width: 599px)"
              srcset="images/unity-games-mobile.png">
      <source media="(min-width: 600px) and (max-width: 1199px)"
              srcset="images/unity-games-tablet.png">
      <img src="images/unity-games-desktop.png" alt="">
    </picture>

    <picture class="poster poster--foreground">
      <source media="(max-width: 599px)"
              srcset="images/unity-games-mobile.png">
      <source media="(min-width: 600px) and (max-width: 1199px)"
              srcset="images/unity-games-tablet.png">
      <img
        src="images/unity-games-desktop.png"
        alt="Unity Games, District of Florida and Caribbean. Coming Soon! Join Us! Sign Up Sheet by the Tagboard. Go for the Win! Miami!"
        width="1586"
        height="992"
        decoding="async"
        fetchpriority="high">
    </picture>

  </main>
</body>
</html>
