  <style>
    :root {
      color-scheme: dark;
      --background: #000000;
      --dot: rgba(255, 255, 255, 0.48);
      --dot-border: rgba(0, 0, 0, 0.45);
      --dot-active: #ffffff;
      --transition-duration: 700ms;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      margin: 0;
      padding: 0;
      overflow: hidden;
      background: var(--background);
      font-family: Arial, Helvetica, sans-serif;
    }

    button,
    iframe {
      font: inherit;
    }

    .carousel {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: var(--background);
      isolation: isolate;
    }

    .slides {
      position: absolute;
      inset: 0;
    }

    .slide {
      position: absolute;
      inset: 0;
      z-index: 0;
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
      transform: scale(1.008);
      transition:
        opacity var(--transition-duration) ease,
        transform var(--transition-duration) ease,
        visibility 0s linear var(--transition-duration);
      background: #000000;
    }

    .slide.is-active {
      z-index: 1;
      opacity: 1;
      visibility: visible;
      pointer-events: auto;
      transform: scale(1);
      transition:
        opacity var(--transition-duration) ease,
        transform var(--transition-duration) ease,
        visibility 0s;
    }

    .slide iframe {
      width: 100%;
      height: 100%;
      display: block;
      border: 0;
      background: #000000;
    }


    @media (prefers-reduced-motion: reduce) {
      .slide,
      .dot {
        transition: none;
      }
    }
  </style>
</head>

  <script>
    (() => {
      "use strict";

      const carousel = document.getElementById("carousel");
      const slides = Array.from(carousel.querySelectorAll(".slide"));

      let currentIndex = 0;
      let introHasPlayed = false;
      let timerId = null;
      let remainingTime = getSlideDuration(currentIndex);
      let timerStartedAt = 0;
      let isPaused = false;


      function getAdjacentIndex(direction) {
        if (introHasPlayed) {
          if (direction > 0 && currentIndex === slides.length - 1) {
            return 1;
          }

          if (direction < 0 && currentIndex === 1) {
            return slides.length - 1;
          }
        }

        return currentIndex + direction;
      }

      function getSlideDuration(index) {
        const duration = Number(slides[index].dataset.duration);
        return Number.isFinite(duration) && duration > 0
          ? duration
          : 15000;
      }

      function getVideoIframe(slide) {
        if (!slide || slide.dataset.videoSlide !== "true") {
          return null;
        }

        return slide.querySelector("iframe");
      }

      function sendVideoCommand(slide, action) {
        const iframe = getVideoIframe(slide);

        if (!iframe || !iframe.contentWindow) {
          return;
        }

        iframe.contentWindow.postMessage(
          {
            type: "video-slide",
            action
          },
          "*"
        );
      }

      function stopTimer() {
        if (timerId !== null) {
          window.clearTimeout(timerId);
          timerId = null;
        }
      }

      function scheduleNextSlide(customDelay) {
        stopTimer();

        if (isPaused || document.hidden) {
          return;
        }

        remainingTime =
          typeof customDelay === "number"
            ? customDelay
            : getSlideDuration(currentIndex);

        timerStartedAt = performance.now();

        timerId = window.setTimeout(() => {
          showSlide(getAdjacentIndex(1), {
            restartTimer: true,
            restartVideo: true
          });
        }, remainingTime);
      }

      function updateActiveStates(nextIndex) {
        slides.forEach((slide, index) => {
          const active = index === nextIndex;

          slide.classList.toggle("is-active", active);
          slide.setAttribute("aria-hidden", String(!active));
        });
      }

      function showSlide(nextIndex, options = {}) {
        let normalizedIndex =
          ((nextIndex % slides.length) + slides.length) % slides.length;

        if (introHasPlayed && normalizedIndex === 0) {
          normalizedIndex =
            nextIndex >= currentIndex
              ? 1
              : slides.length - 1;
        }

        const previousSlide = slides[currentIndex];
        const nextSlide = slides[normalizedIndex];

        /*
          Pause the video whenever its slide is left.
        */
        if (previousSlide !== nextSlide) {
          sendVideoCommand(previousSlide, "pause");
        }

        if (
          previousSlide.dataset.introSlide === "true" &&
          previousSlide !== nextSlide
        ) {
          introHasPlayed = true;
        }

        currentIndex = normalizedIndex;
        updateActiveStates(currentIndex);

        /*
          Restart the video from the beginning whenever its slide appears.
          The video page itself still has continuous looping enabled.
        */
        if (nextSlide.dataset.videoSlide === "true") {
          sendVideoCommand(
            nextSlide,
            options.restartVideo === false ? "play" : "restart"
          );
        }

        remainingTime = getSlideDuration(currentIndex);

        if (options.restartTimer !== false) {
          scheduleNextSlide();
        }
      }

      function pauseCarousel() {
        if (isPaused) {
          return;
        }

        isPaused = true;

        if (timerId !== null) {
          const elapsed = performance.now() - timerStartedAt;
          remainingTime = Math.max(0, remainingTime - elapsed);
        }

        stopTimer();
        sendVideoCommand(slides[currentIndex], "pause");
      }

      function resumeCarousel() {
        if (!isPaused) {
          return;
        }

        isPaused = false;
        sendVideoCommand(slides[currentIndex], "play");

        scheduleNextSlide(
          remainingTime > 0
            ? remainingTime
            : getSlideDuration(currentIndex)
        );
      }

      /*
        Keyboard navigation remains available without adding visible arrows.
      */
      window.addEventListener("keydown", (event) => {
        if (event.key === "ArrowRight") {
          showSlide(getAdjacentIndex(1), {
            restartTimer: true,
            restartVideo: true
          });
        }

        if (event.key === "ArrowLeft") {
          showSlide(getAdjacentIndex(-1), {
            restartTimer: true,
            restartVideo: true
          });
        }
      });

      /*
        Pause timing when the browser tab is hidden.
      */
      document.addEventListener("visibilitychange", () => {
        if (document.hidden) {
          pauseCarousel();
        } else {
          resumeCarousel();
        }
      });

      /*
        Optional public controls for other scripts:
        window.anniversaryCarousel.next()
        window.anniversaryCarousel.previous()
        window.anniversaryCarousel.goTo(2)
        window.anniversaryCarousel.pause()
        window.anniversaryCarousel.play()
      */
      window.bulletinCarousel = {
        next() {
          showSlide(getAdjacentIndex(1), {
            restartTimer: true,
            restartVideo: true
          });
        },

        previous() {
          showSlide(getAdjacentIndex(-1), {
            restartTimer: true,
            restartVideo: true
          });
        },

        goTo(index) {
          showSlide(Number(index), {
            restartTimer: true,
            restartVideo: true
          });
        },

        pause: pauseCarousel,
        play: resumeCarousel,

        getCurrentIndex() {
          return currentIndex;
        }
      };

      /*
        Start with the first slide.
      */
      updateActiveStates(currentIndex);
      scheduleNextSlide();
    })();
  </script>
