<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#ffffff">
  <title>Unity Games Volleyball — Venue QR Page</title>
  <style>
    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      min-height: 100%;
      background: #ffffff;
    }

    body {
      min-height: 100svh;
      display: grid;
      place-items: center;
      overflow-x: hidden;
      font-family: Arial, Helvetica, sans-serif;
    }

    .poster {
      width: 100%;
      min-height: 100svh;
      display: grid;
      place-items: center;
      background: #ffffff;
    }

    .poster-link {
      display: block;
      width: 100%;
      text-decoration: none;
      cursor: pointer;
    }

    .poster picture {
      display: block;
      width: 100%;
    }

    .poster img.hero {
      display: block;
      width: 100%;
      height: auto;
      margin: 0 auto;
    }

    .qr-download {
      position: fixed;
      right: 16px;
      bottom: 16px;
      z-index: 10;
      background: #0d2c54;
      color: #fff;
      text-decoration: none;
      font-weight: 700;
      font-size: 14px;
      letter-spacing: .02em;
      padding: 10px 14px;
      border-radius: 999px;
      box-shadow: 0 8px 22px rgba(0,0,0,.14);
    }

    .qr-download:hover,
    .qr-download:focus {
      background: #b81922;
    }

    /* Desktop */
    @media (min-width: 1024px) {
      .poster img.hero {
        width: 100vw;
        height: 100svh;
        object-fit: contain;
      }
    }

    /* Tablet */
    @media (min-width: 600px) and (max-width: 1023px) {
      .poster img.hero {
        width: 100vw;
        height: 100svh;
        object-fit: contain;
      }
    }

    /* Mobile */
    @media (max-width: 599px) {
      body {
        align-items: start;
      }

      .poster {
        min-height: 100svh;
        align-items: start;
      }

      .poster img.hero {
        width: 100vw;
        height: auto;
        object-fit: contain;
      }

      .qr-download {
        right: 12px;
        bottom: 12px;
        font-size: 13px;
        padding: 9px 12px;
      }
    }

    /* Landscape phones */
    @media (max-height: 599px) and (orientation: landscape) {
      .poster img.hero {
        width: 100vw;
        height: 100svh;
        object-fit: contain;
      }
    }
  </style>
</head>
<body>
  <main class="poster" aria-label="Unity Games Volleyball venue page with QR code">
    <a
      class="poster-link"
      href="https://share.google/SPSBBH4NkinkyFLPm"
      target="_blank"
      rel="noopener noreferrer"
      aria-label="Open Wells Activity Center venue location">
      <picture>
        <source
          media="(max-height: 599px) and (orientation: landscape)"
          srcset="unity-games-venue-tablet.png">

        <source
          media="(min-width: 1024px)"
          srcset="unity-games-venue-desktop.png">

        <source
          media="(min-width: 600px)"
          srcset="unity-games-venue-tablet.png">

        <img
          class="hero"
          src="unity-games-venue-mobile.png"
          alt="Unity Games Volleyball venue page for Wells Activity Center, Apopka, Florida with QR code, date Monday September 7, 2026, and registration opening at 7:30 AM."
          decoding="async">
      </picture>
    </a>
  </main>

  <a class="qr-download" href="wells-activity-center-qr.png" download>
    Download QR Code
  </a>
</body>
</html>
