<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>INC TSV Responsive Page</title>
  <style>
    :root {
      --navy: #17324D;
      --blue: #2F6FAE;
      --border: #C9D6E6;
      --muted: #51606F;
      --gold: #FFF3DC;
      --green: #EAF7EF;
      --light-blue: #EAF3FF;
    }

    * {
      box-sizing: border-box;
    }

    html, body {
      margin: 0;
      min-height: 100%;
      width: 100%;
      background: #ffffff;
    }

    body {
      overflow-x: hidden;
      font-family: Arial, Helvetica, sans-serif;
    }

    .responsive-hero {
      width: 100%;
      min-height: 100vh;
    }

    .responsive-hero picture,
    .responsive-hero img {
      display: block;
      width: 100%;
      min-height: 100vh;
    }

    .responsive-hero img {
      object-fit: cover;
      object-position: center top;
    }

    /* Desktop: 1200px and wider */
    @media (min-width: 1200px) {
      .responsive-hero img {
        width: 100vw;
        height: 100vh;
        object-fit: cover;
      }
    }

    /* Tablet: 600px–1199px */
    @media (min-width: 600px) and (max-width: 1199px) {
      .responsive-hero img {
        width: 100vw;
        height: 100vh;
        object-fit: cover;
      }
    }

    /* Mobile: below 600px */
    @media (max-width: 599px) {
      .responsive-hero img {
        width: 100vw;
        height: 100vh;
        object-fit: cover;
      }
    }

    /* Re-open button after the automatic popup has been closed */
    .video-popup-trigger {
      position: fixed;
      right: 18px;
      bottom: 18px;
      z-index: 9000;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      padding: 12px 20px;
      border: 0;
      border-radius: 999px;
      background: linear-gradient(135deg, var(--navy), var(--blue));
      color: white;
      font: inherit;
      font-weight: 900;
      cursor: pointer;
      box-shadow: 0 6px 16px rgba(23, 50, 77, 0.20);
    }

    .video-popup-trigger:hover,
    .video-popup-trigger:focus-visible {
      transform: translateY(-1px);
      outline: 3px solid rgba(47, 111, 174, 0.28);
      outline-offset: 3px;
    }

    /* TSV Group Video Carousel Popup */
    .video-modal {
      position: fixed;
      inset: 0;
      z-index: 9999;
      display: none;
      align-items: center;
      justify-content: center;
      padding: 18px;
      background: rgba(8, 20, 33, 0.78);
      backdrop-filter: blur(5px);
    }

    .video-modal.open {
      display: flex;
    }

    .video-modal-panel {
      width: min(980px, 100%);
      max-height: calc(100vh - 36px);
      overflow: auto;
      background: white;
      border: 1px solid var(--border);
      border-radius: 22px;
      box-shadow: 0 24px 70px rgba(0, 0, 0, 0.36);
    }

    .video-modal-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      padding: 18px 20px;
      border-bottom: 1px solid var(--border);
    }

    .video-modal-header h2 {
      margin: 0;
      color: var(--navy);
      font-size: clamp(22px, 3vw, 32px);
    }

    .video-modal-header-actions {
      display: flex;
      align-items: center;
      justify-content: flex-end;
      gap: 10px;
      min-width: 0;
    }

    .video-group-nav {
      display: flex;
      align-items: center;
      justify-content: flex-end;
      gap: 8px;
      flex-wrap: wrap;
    }

    .video-group-nav-button {
      appearance: none;
      border: 1px solid var(--border);
      border-radius: 999px;
      padding: 9px 13px;
      color: var(--navy);
      font: inherit;
      font-size: 13px;
      font-weight: 900;
      line-height: 1.1;
      cursor: pointer;
      box-shadow: 0 4px 10px rgba(23, 50, 77, 0.08);
      transition: transform 0.16s ease, box-shadow 0.16s ease, border-color 0.16s ease, filter 0.16s ease;
      white-space: nowrap;
    }

    .video-group-nav-button.crimping {
      background: var(--light-blue);
    }

    .video-group-nav-button.signal-flow {
      background: var(--gold);
    }

    .video-group-nav-button.webex {
      background: var(--green);
    }

    .video-group-nav-button:hover,
    .video-group-nav-button:focus-visible {
      transform: translateY(-3px);
      box-shadow: 0 10px 20px rgba(23, 50, 77, 0.18);
      border-color: var(--blue);
      filter: saturate(1.08);
      outline: none;
    }

    .video-group-nav-button:focus-visible {
      outline: 3px solid rgba(47, 111, 174, 0.24);
      outline-offset: 2px;
    }

    .video-group-nav-button.active,
    .video-group-nav-button[aria-current="true"] {
      border-color: var(--navy);
      box-shadow:
        0 0 0 3px rgba(47, 111, 174, 0.16),
        0 7px 16px rgba(23, 50, 77, 0.16);
      transform: translateY(-1px);
    }

    .video-modal-close {
      flex: 0 0 auto;
      width: 42px;
      height: 42px;
      border: 1px solid var(--border);
      border-radius: 50%;
      background: #fff;
      color: var(--navy);
      font-size: 26px;
      line-height: 1;
      cursor: pointer;
    }

    .video-carousel {
      position: relative;
      padding: 18px 64px 8px;
    }

    .video-slide {
      display: none;
    }

    .video-slide.active {
      display: block;
    }

    .video-frame {
      position: relative;
      width: 100%;
      aspect-ratio: 16 / 9;
      overflow: hidden;
      background: #000;
      border-radius: 16px;
      box-shadow: 0 8px 24px rgba(23, 50, 77, 0.16);
    }

    .video-frame video {
      width: 100%;
      height: 100%;
      display: block;
      object-fit: contain;
      background: #000;
    }

    .video-slide-title {
      margin: 15px 0 4px;
      color: var(--navy);
      text-align: center;
      font-size: clamp(20px, 2.5vw, 28px);
    }

    .video-slide-note {
      margin: 0 auto;
      max-width: 760px;
      color: var(--muted);
      text-align: center;
      line-height: 1.5;
    }

    .carousel-nav-button {
      position: absolute;
      top: 46%;
      transform: translateY(-50%);
      z-index: 2;
      width: 44px;
      height: 44px;
      border: 0;
      border-radius: 50%;
      background: rgba(23, 50, 77, 0.92);
      color: white;
      font-size: 26px;
      cursor: pointer;
      box-shadow: 0 6px 16px rgba(0, 0, 0, 0.18);
    }

    .carousel-nav-button.prev { left: 10px; }
    .carousel-nav-button.next { right: 10px; }

    .video-carousel-dots {
      display: flex;
      justify-content: center;
      gap: 10px;
      padding: 14px 20px 22px;
    }

    .video-carousel-dot {
      width: 12px;
      height: 12px;
      padding: 0;
      border: 0;
      border-radius: 50%;
      background: #B5C1CF;
      cursor: pointer;
    }

    .video-carousel-dot.active {
      background: var(--blue);
      box-shadow: 0 0 0 4px rgba(47, 111, 174, 0.13);
    }

    body.video-modal-open {
      overflow: hidden;
    }

    @media (max-width: 760px) {
      .video-modal-header {
        align-items: flex-start;
        flex-wrap: wrap;
      }

      .video-modal-header-actions {
        width: 100%;
        justify-content: flex-end;
      }

      .video-group-nav {
        flex: 1 1 auto;
        justify-content: flex-end;
      }
    }

    @media (max-width: 640px) {
      .video-modal {
        padding: 10px;
      }

      .video-modal-panel {
        max-height: calc(100vh - 20px);
        border-radius: 18px;
      }

      .video-modal-header {
        padding: 14px;
      }

      .video-group-nav-button {
        padding: 8px 10px;
        font-size: 12px;
      }

      .video-carousel {
        padding: 14px 44px 4px;
      }

      .carousel-nav-button {
        width: 38px;
        height: 38px;
        font-size: 22px;
      }

      .carousel-nav-button.prev { left: 4px; }
      .carousel-nav-button.next { right: 4px; }

      .video-popup-trigger {
        right: 12px;
        bottom: 12px;
        padding: 10px 14px;
        font-size: 13px;
      }
    }
  </style>
</head>
<body>
  <main class="responsive-hero">
    <picture>
      <!-- Desktop: 1200px and wider -->
      <source
        media="(min-width: 1200px)"
        srcset="images/tsv-desktop.png"
      />

      <!-- Tablet: 600px–1199px -->
      <source
        media="(min-width: 600px)"
        srcset="images/tsv-tablet.png"
      />

      <!-- Mobile: below 600px -->
      <img
        src="images/tsv-mobile.png"
        alt="INC TSV technology background"
      />
    </picture>
  </main>

  <button class="video-popup-trigger" id="openVideoPopup" type="button">
    ▶ Watch TSV Group Videos
  </button>

  <div class="video-modal" id="videoModal" role="dialog" aria-modal="true" aria-labelledby="videoModalTitle" aria-hidden="true">
    <div class="video-modal-panel">
      <div class="video-modal-header">
        <h2 id="videoModalTitle">TSV Group Videos</h2>
        <div class="video-modal-header-actions">
          <nav class="video-group-nav" aria-label="Choose a TSV group video">
            <button class="video-group-nav-button crimping active" type="button" data-video-header-nav="0" aria-label="Show Crimping video" aria-current="true">Crimping</button>
            <button class="video-group-nav-button signal-flow" type="button" data-video-header-nav="1" aria-label="Show Signal Flow video" aria-current="false">Signal Flow</button>
            <button class="video-group-nav-button webex" type="button" data-video-header-nav="2" aria-label="Show WebEx video" aria-current="false">WebEx</button>
          </nav>
          <button class="video-modal-close" id="closeVideoPopup" type="button" aria-label="Close video popup">×</button>
        </div>
      </div>

      <div class="video-carousel" id="tsvVideoCarousel">
        <button class="carousel-nav-button prev" id="videoPrev" type="button" aria-label="Previous video">‹</button>

        <section class="video-slide active" data-video-slide="0" aria-label="Crimping Team video">
          <div class="video-frame">
            <video id="crimpingVideo" controls playsinline preload="auto">
              <source src="https://pub-e605f3dc0e634e67928661918fa2d9d4.r2.dev/crimping.mp4" type="video/mp4" />
              Your browser does not support HTML5 video.
            </video>
          </div>
          <h3 class="video-slide-title">Crimping Team Group</h3>
          <p class="video-slide-note">Crimping RJ45 Ethernet Cables — TSV technical video.</p>
        </section>

        <section class="video-slide" data-video-slide="1" aria-label="Signal Flow Team video">
          <div class="video-frame">
            <video id="signalFlowVideo" controls playsinline preload="auto">
              <source src="https://pub-e605f3dc0e634e67928661918fa2d9d4.r2.dev/signal-flow.mp4" type="video/mp4" />
              Your browser does not support HTML5 video.
            </video>
          </div>
          <h3 class="video-slide-title">Signal Flow Team Group</h3>
          <p class="video-slide-note">Signal Flow: Improving Sound for Worship Services — TSV technical video.</p>
        </section>

        <section class="video-slide" data-video-slide="2" aria-label="WebEx Team video">
          <div class="video-frame">
            <video id="webexVideo" controls playsinline preload="auto">
              <source src="https://pub-e605f3dc0e634e67928661918fa2d9d4.r2.dev/webex.mp4" type="video/mp4" />
              Your browser does not support HTML5 video.
            </video>
          </div>
          <h3 class="video-slide-title">WebEx Team Group</h3>
          <p class="video-slide-note">Using WebEx for Hosting Worship Services — TSV technical video.</p>
        </section>

        <button class="carousel-nav-button next" id="videoNext" type="button" aria-label="Next video">›</button>
      </div>

      <div class="video-carousel-dots" aria-label="Choose a TSV group video">
        <button class="video-carousel-dot active" type="button" data-video-dot="0" aria-label="Crimping video"></button>
        <button class="video-carousel-dot" type="button" data-video-dot="1" aria-label="Signal Flow video"></button>
        <button class="video-carousel-dot" type="button" data-video-dot="2" aria-label="WebEx video"></button>
      </div>
    </div>
  </div>

  <script>
    (function () {
      const modal = document.getElementById("videoModal");
      const openButton = document.getElementById("openVideoPopup");
      const closeButton = document.getElementById("closeVideoPopup");
      const prevButton = document.getElementById("videoPrev");
      const nextButton = document.getElementById("videoNext");
      const slides = Array.from(document.querySelectorAll("[data-video-slide]"));
      const dots = Array.from(document.querySelectorAll("[data-video-dot]"));
      const headerNavButtons = Array.from(document.querySelectorAll("[data-video-header-nav]"));
      const videos = Array.from(modal.querySelectorAll("video"));

      let currentSlide = 0;
      let lastTrigger = openButton;

      videos.forEach(function (video) {
        const source = video.querySelector("source");
        if (source && source.getAttribute("src")) {
          video.load();
        }
      });

      function randomSlideIndex() {
        return Math.floor(Math.random() * slides.length);
      }

      function pauseAllVideos() {
        videos.forEach(function (video) {
          video.pause();
        });
      }

      function showSlide(index) {
        currentSlide = (index + slides.length) % slides.length;
        pauseAllVideos();

        slides.forEach(function (slide, slideIndex) {
          slide.classList.toggle("active", slideIndex === currentSlide);
        });

        dots.forEach(function (dot, dotIndex) {
          const isActive = dotIndex === currentSlide;
          dot.classList.toggle("active", isActive);
          dot.setAttribute("aria-current", isActive ? "true" : "false");
        });

        headerNavButtons.forEach(function (button, buttonIndex) {
          const isActive = buttonIndex === currentSlide;
          button.classList.toggle("active", isActive);
          button.setAttribute("aria-current", isActive ? "true" : "false");
        });
      }

      function openModal(startIndex, trigger) {
        const requestedIndex = Number.isInteger(startIndex) ? startIndex : randomSlideIndex();
        lastTrigger = trigger || openButton;
        showSlide(requestedIndex);
        modal.classList.add("open");
        modal.setAttribute("aria-hidden", "false");
        document.body.classList.add("video-modal-open");
        closeButton.focus();
      }

      function closeModal() {
        pauseAllVideos();
        modal.classList.remove("open");
        modal.setAttribute("aria-hidden", "true");
        document.body.classList.remove("video-modal-open");

        if (lastTrigger && typeof lastTrigger.focus === "function") {
          lastTrigger.focus();
        }
      }

      function openRandomVideo(trigger) {
        openModal(randomSlideIndex(), trigger || openButton);
      }

      // The Watch TSV Group Videos button behaves exactly like the automatic popup:
      // every time it is clicked, it starts on a randomly selected TSV video.
      openButton.addEventListener("click", function () {
        openRandomVideo(openButton);
      });

      closeButton.addEventListener("click", closeModal);
      prevButton.addEventListener("click", function () {
        showSlide(currentSlide - 1);
      });
      nextButton.addEventListener("click", function () {
        showSlide(currentSlide + 1);
      });

      dots.forEach(function (dot) {
        dot.addEventListener("click", function () {
          showSlide(Number(dot.getAttribute("data-video-dot")));
        });
      });

      headerNavButtons.forEach(function (button) {
        button.addEventListener("click", function () {
          showSlide(Number(button.getAttribute("data-video-header-nav")));
        });
      });

      modal.addEventListener("click", function (event) {
        if (event.target === modal) {
          closeModal();
        }
      });

      document.addEventListener("keydown", function (event) {
        if (!modal.classList.contains("open")) return;
        if (event.key === "Escape") closeModal();
        if (event.key === "ArrowLeft") showSlide(currentSlide - 1);
        if (event.key === "ArrowRight") showSlide(currentSlide + 1);
      });

      // Automatically open the popup shortly after the page loads.
      // It uses the exact same random-start behavior as the Watch TSV Group Videos button.
      window.addEventListener("load", function () {
        window.setTimeout(function () {
          openRandomVideo(openButton);
        }, 250);
      });
    }());
  </script>
</body>
</html>
