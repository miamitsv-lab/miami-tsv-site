<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CFO Videoke – Balanced Responsive Version</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      width: 100%;
      height: 100%;
      background: #000;
      overflow: hidden;
      font-family: Arial, Helvetica, sans-serif;
    }

    body {
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .stage {
      width: 100vw;
      height: 100vh;
      height: 100svh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #000;
      padding: 12px;
    }

    picture {
      width: 100%;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    img {
      display: block;
      width: 100%;
      height: 100%;
      object-fit: contain;
      background: #000;
      border: 0;
    }

    /* Desktop: fill most of screen with small breathing room */
    @media (min-width: 1024px) {
      .stage {
        padding: 18px 24px;
      }
    }

    /* Tablet: moderate safe padding */
    @media (min-width: 600px) and (max-width: 1023px) {
      .stage {
        padding: 16px;
      }
    }

    /* Mobile: slightly more padding to avoid touching edges */
    @media (max-width: 599px) {
      .stage {
        padding: 10px;
      }
    }
  </style>
</head>
<body>
  <main class="stage">
    <picture>
      <source media="(max-width: 599px)" srcset="cfo-videoke-mobile.png" />
      <source media="(max-width: 1023px)" srcset="cfo-videoke-tablet.png" />
      <img src="cfo-videoke-desktop.png" alt="CFO Videoke Guarding Night Edition poster" />
    </picture>
  </main>
</body>
</html>
