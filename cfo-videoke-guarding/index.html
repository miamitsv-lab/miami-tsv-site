<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CFO Videoke – Fill Screen Background</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      font-family: Arial, Helvetica, sans-serif;
      background: #000;
    }
    .hero {
      width: 100%;
      height: 100vh;
      height: 100svh;
      background-color: #000;
      background-image: url('cfo-videoke-desktop.png');
      background-repeat: no-repeat;
      background-position: center center;
      background-size: cover;
    }
    @media (max-width: 1023px) {
      .hero {
        background-image: url('cfo-videoke-tablet.png');
      }
    }
    @media (max-width: 599px) {
      .hero {
        background-image: url('cfo-videoke-mobile.png');
      }
    }
  </style>
</head>
<body>
  <main class="hero" aria-label="CFO Videoke Guarding Night Edition poster background"></main>
</body>
</html>
