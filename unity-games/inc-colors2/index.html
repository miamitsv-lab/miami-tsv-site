<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport"
        content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#060806">

  <title>Unity Games — INC Colors</title>
  <meta name="description"
        content="Unity Games promotional page in INC colors with Wells Activity Center venue QR code.">

  <link rel="preload"
        as="image"
        href="images/unity-games-mobile.png"
        media="(max-width: 599px)">
  <link rel="preload"
        as="image"
        href="images/unity-games-tablet.png"
        media="(min-width: 600px) and (max-width: 1199px)">
  <link rel="preload"
        as="image"
        href="images/unity-games-desktop.png"
        media="(min-width: 1200px)">
  <link rel="preload"
        as="image"
        href="images/wells-activity-center-qr.png">

  <style>
    :root {
      color-scheme: dark;
      background: #060806;
      --stage-ratio: 1.5987903226; /* 1586 / 992 */
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      background: #060806;
    }

    body {
      min-height: 100vh;
      min-height: 100svh;
      min-height: 100dvh;
      font-family: Arial, Helvetica, sans-serif;
    }

    .poster-page {
      position: fixed;
      inset: 0;
      display: grid;
      place-items: center;
      overflow: hidden;
      background: #060806;
      isolation: isolate;
    }

    /* Same blurred-fill behavior as the supplied page. */
    .poster--background {
      position: absolute;
      z-index: -2;
      inset: -5%;
      width: 110%;
      height: 110%;
      opacity: 0.78;
      filter: blur(34px) brightness(0.48) saturate(1.08);
      transform: scale(1.06);
    }

    .poster--background img {
      display: block;
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: center;
      user-select: none;
      -webkit-user-drag: none;
    }

    .poster-page::after {
      content: "";
      position: absolute;
      inset: 0;
      z-index: -1;
      pointer-events: none;
      background:
        linear-gradient(
          to bottom,
          rgba(0, 0, 0, 0.08),
          rgba(0, 0, 0, 0.01) 48%,
          rgba(0, 0, 0, 0.13)
        );
    }

    /*
      The stage always has the exact aspect ratio of the active supplied image.
      This lets the QR panel stay aligned to the artwork instead of drifting
      when the browser window changes shape.
    */
    .poster-stage {
      position: relative;
      z-index: 1;
      width: min(100vw, calc(100vh * var(--stage-ratio)));
      height: min(100vh, calc(100vw / var(--stage-ratio)));
      max-width: 100vw;
      max-height: 100vh;
    }

    .poster--foreground {
      position: absolute;
      inset: 0;
      display: block;
      width: 100%;
      height: 100%;
    }

    .poster--foreground img {
      display: block;
      width: 100%;
      height: 100%;
      object-fit: fill;
      user-select: none;
      -webkit-user-drag: none;
    }

    /*
      Venue panel:
      - It sits over the original "COMING SOON!" area.
      - Therefore the old words are no longer visible.
      - It stays inside the first viewport, so no scrolling is needed.
    */
    .venue-qr {
      position: absolute;
      z-index: 5;
      left: 38.8%;
      top: 34.6%;
      width: 34.2%;
      height: 16.2%;
      min-width: 0;
      color: #fff;
      text-decoration: none;
      border: clamp(1px, .14vw, 3px) solid #f2bd45;
      border-radius: clamp(8px, 1.1vw, 18px);
      background:
        linear-gradient(115deg, rgba(5, 8, 6, .98), rgba(20, 28, 16, .98));
      box-shadow:
        0 0 0 clamp(1px, .08vw, 2px) rgba(8, 112, 42, .55),
        0 0 clamp(10px, 1.6vw, 26px) rgba(255, 216, 93, .38),
        0 0 clamp(12px, 2vw, 32px) rgba(255, 255, 255, .18);
      overflow: hidden;
      transform: skewX(-4deg);
    }

    .venue-qr::before {
      content: "";
      position: absolute;
      inset: 0;
      background:
        linear-gradient(90deg,
          rgba(198, 20, 26, .24),
          transparent 35%,
          transparent 65%,
          rgba(0, 111, 48, .25));
      pointer-events: none;
    }

    .venue-qr__inner {
      position: relative;
      width: 100%;
      height: 100%;
      display: grid;
      grid-template-columns: minmax(64px, 33%) 1fr;
      align-items: center;
      gap: clamp(6px, .8vw, 13px);
      padding: clamp(6px, .75vw, 11px);
      transform: skewX(4deg);
    }

    .venue-qr__code {
      width: 100%;
      aspect-ratio: 1;
      min-width: 0;
      align-self: center;
      background: #fff;
      border-radius: clamp(4px, .5vw, 8px);
      padding: clamp(2px, .24vw, 4px);
      box-shadow: 0 0 10px rgba(255,255,255,.3);
    }

    .venue-qr__code img {
      display: block;
      width: 100%;
      height: 100%;
      object-fit: contain;
    }

    .venue-qr__copy {
      min-width: 0;
      line-height: 1.02;
      text-transform: uppercase;
      text-shadow: 0 2px 6px rgba(0,0,0,.8);
    }

    .venue-qr__eyebrow {
      display: block;
      margin-bottom: .28em;
      color: #f2bd45;
      font-size: clamp(7px, .82vw, 14px);
      font-weight: 900;
      letter-spacing: .09em;
    }

    .venue-qr__name {
      display: block;
      color: #fff;
      font-size: clamp(9px, 1.08vw, 18px);
      font-weight: 900;
      letter-spacing: .025em;
    }

    .venue-qr__city {
      display: block;
      margin-top: .28em;
      color: #78d464;
      font-size: clamp(7px, .78vw, 13px);
      font-weight: 900;
      letter-spacing: .05em;
    }

    .venue-qr__action {
      display: block;
      margin-top: .5em;
      color: #fff;
      font-size: clamp(6px, .64vw, 11px);
      font-weight: 800;
      letter-spacing: .08em;
      opacity: .92;
    }

    .venue-qr:hover,
    .venue-qr:focus-visible {
      border-color: #fff2ac;
      box-shadow:
        0 0 0 2px rgba(8, 112, 42, .65),
        0 0 30px rgba(255, 216, 93, .58);
      outline: none;
    }

    /* Tablet artwork is 1448 × 1086. */
    @media (min-width: 600px) and (max-width: 1199px) {
      :root {
        --stage-ratio: 1.3333333333;
      }

      .venue-qr {
        left: 38.9%;
        top: 34.3%;
        width: 35.2%;
        height: 16.8%;
      }

      .venue-qr__eyebrow {
        font-size: clamp(7px, 1.06vw, 14px);
      }

      .venue-qr__name {
        font-size: clamp(9px, 1.38vw, 18px);
      }

      .venue-qr__city {
        font-size: clamp(7px, 1vw, 13px);
      }

      .venue-qr__action {
        font-size: clamp(6px, .82vw, 11px);
      }
    }

    /* Mobile artwork is 941 × 1672. */
    @media (max-width: 599px) {
      :root {
        --stage-ratio: 0.5627990431;
      }

      /*
        On mobile the venue card covers the "COMING SOON!" text at the
        upper-right and remains tappable. The large original JOIN US stays
        visible directly beneath it.
      */
      .venue-qr {
        left: 47.8%;
        top: 20.6%;
        width: 48.6%;
        height: 15.4%;
        transform: none;
        border-radius: 10px;
      }

      .venue-qr__inner {
        transform: none;
        grid-template-columns: minmax(58px, 34%) 1fr;
        gap: 5px;
        padding: 5px;
      }

      .venue-qr__eyebrow {
        font-size: clamp(6px, 2.15vw, 10px);
      }

      .venue-qr__name {
        font-size: clamp(7px, 2.55vw, 12px);
      }

      .venue-qr__city {
        font-size: clamp(6px, 1.95vw, 9px);
      }

      .venue-qr__action {
        font-size: clamp(5px, 1.7vw, 8px);
      }
    }

    @media (prefers-reduced-motion: no-preference) {
      .poster-stage {
        animation: poster-reveal 420ms ease-out both;
      }

      @keyframes poster-reveal {
        from {
          opacity: 0;
          transform: scale(1.006);
        }
        to {
          opacity: 1;
          transform: scale(1);
        }
      }
    }

    @media print {
      html,
      body {
        overflow: visible;
        background: #fff;
      }

      .poster-page {
        position: relative;
        min-height: 100vh;
      }

      .poster--background,
      .poster-page::after {
        display: none;
      }
    }
  </style>
</head>

<body>
  <main class="poster-page"
        aria-label="Unity Games promotional announcement">

    <picture class="poster--background" aria-hidden="true">
      <source media="(max-width: 599px)"
              srcset="images/unity-games-mobile.png">
      <source media="(min-width: 600px) and (max-width: 1199px)"
              srcset="images/unity-games-tablet.png">
      <img src="images/unity-games-desktop.png" alt="">
    </picture>

    <div class="poster-stage">
      <picture class="poster--foreground">
        <source media="(max-width: 599px)"
                srcset="images/unity-games-mobile.png">
        <source media="(min-width: 600px) and (max-width: 1199px)"
                srcset="images/unity-games-tablet.png">
        <img
          src="images/unity-games-desktop.png"
          alt="Unity Games, District of Florida and Caribbean. Join Us! Go for the Win! Miami!"
          width="1586"
          height="992"
          decoding="async"
          fetchpriority="high">
      </picture>

      <a class="venue-qr"
         href="https://share.google/SPSBBH4NkinkyFLPm"
         target="_blank"
         rel="noopener noreferrer"
         aria-label="Open Wells Activity Center venue location">
        <span class="venue-qr__inner">
          <span class="venue-qr__code">
            <img src="images/wells-activity-center-qr.png"
                 alt="QR code for Wells Activity Center">
          </span>
          <span class="venue-qr__copy">
            <span class="venue-qr__eyebrow">Venue</span>
            <span class="venue-qr__name">Wells Activity Center</span>
            <span class="venue-qr__city">Apopka, Florida</span>
            <span class="venue-qr__action">Scan or tap for location</span>
          </span>
        </span>
      </a>
    </div>

  </main>
</body>
</html>
