<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#000000">
  <title>INC 112th Anniversary Video</title>
  <style>
    :root {
      color-scheme: dark;
      --background: #000;
      --foreground: #fff;
      --accent: #feba02;
    }

    * { box-sizing: border-box; }

    html,
    body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      background: var(--background);
      font-family: Arial, Helvetica, sans-serif;
    }

    .video-slide {
      position: fixed;
      inset: 0;
      display: grid;
      place-items: center;
      background: #000;
    }

    video {
      width: 100%;
      height: 100%;
      display: block;
      object-fit: contain;
      object-position: center;
      background: #000;
    }

    .play-fallback {
      position: absolute;
      inset: 0;
      display: none;
      place-items: center;
      padding: 24px;
      border: 0;
      color: var(--foreground);
      background: rgba(0, 0, 0, 0.62);
      cursor: pointer;
      text-align: center;
    }

    .play-fallback.is-visible { display: grid; }

    .play-fallback__content {
      display: grid;
      justify-items: center;
      gap: 14px;
      font-size: clamp(16px, 2vw, 24px);
      font-weight: 700;
    }

    .play-icon {
      width: clamp(64px, 9vw, 96px);
      aspect-ratio: 1;
      display: grid;
      place-items: center;
      border: 3px solid rgba(255, 255, 255, 0.9);
      border-radius: 50%;
      background: rgba(0, 0, 0, 0.34);
      box-shadow: 0 8px 28px rgba(0, 0, 0, 0.35);
    }

    .play-icon::before {
      content: "";
      width: 0;
      height: 0;
      margin-left: 7%;
      border-top: 14px solid transparent;
      border-bottom: 14px solid transparent;
      border-left: 23px solid var(--accent);
    }

    @media (prefers-reduced-motion: reduce) {
      video { animation: none; }
    }
  </style>
</head>
<body>
  <main class="video-slide" aria-label="112th Anniversary video slide">
    <video
      id="carouselVideo"
      autoplay
      muted
      playsinline
      preload="auto"
      disablepictureinpicture
      controlslist="nodownload noplaybackrate noremoteplayback"
      aria-label="112th Anniversary video"
    >
      <source src="assets/inc-112-video-16x9.mp4" type="video/mp4">
      Your browser does not support HTML5 video.
    </video>

    <button id="playFallback" class="play-fallback" type="button" aria-label="Play video">
      <span class="play-fallback__content">
        <span class="play-icon" aria-hidden="true"></span>
        <span>Tap to play video</span>
      </span>
    </button>
  </main>

  <script>
    (() => {
      const video = document.getElementById('carouselVideo');
      const playFallback = document.getElementById('playFallback');
      const params = new URLSearchParams(window.location.search);

      // Optional URL settings:
      // ?controls=1 displays native controls.
      // ?loop=1 loops the video instead of notifying the carousel at the end.
      // ?muted=0 requests sound, but browsers may block autoplay with sound.
      video.controls = params.get('controls') === '1';
      video.loop = params.get('loop') === '1';
      video.muted = params.get('muted') !== '0';

      const notifyParent = (type, extra = {}) => {
        if (window.parent === window) return;
        window.parent.postMessage({
          source: 'html-video-carousel-slide',
          type,
          duration: Number.isFinite(video.duration) ? video.duration : null,
          currentTime: video.currentTime,
          ...extra
        }, '*');
      };

      const attemptPlay = async () => {
        try {
          await video.play();
          playFallback.classList.remove('is-visible');
        } catch (error) {
          // Autoplay can be blocked by browser policy. Keep the page usable.
          video.muted = true;
          try {
            await video.play();
            playFallback.classList.remove('is-visible');
          } catch (_) {
            playFallback.classList.add('is-visible');
          }
        }
      };

      playFallback.addEventListener('click', attemptPlay);

      video.addEventListener('loadedmetadata', () => {
        notifyParent('video-ready');
        attemptPlay();
      });

      video.addEventListener('play', () => notifyParent('video-play'));
      video.addEventListener('pause', () => notifyParent('video-pause'));
      video.addEventListener('error', () => notifyParent('video-error'));

      video.addEventListener('ended', () => {
        if (!video.loop) {
          notifyParent('video-ended');
          window.dispatchEvent(new CustomEvent('carousel-slide-ended'));
        }
      });

      // Parent carousel controls. Useful when this page is inside an iframe.
      window.addEventListener('message', (event) => {
        const message = event.data;
        if (!message || typeof message !== 'object') return;

        switch (message.type) {
          case 'carousel:play':
            attemptPlay();
            break;
          case 'carousel:pause':
            video.pause();
            break;
          case 'carousel:reset':
            video.pause();
            video.currentTime = 0;
            break;
          case 'carousel:restart':
            video.currentTime = 0;
            attemptPlay();
            break;
        }
      });

      // Pause when the page or iframe is hidden; resume when visible again.
      document.addEventListener('visibilitychange', () => {
        if (document.hidden) {
          video.pause();
        } else {
          attemptPlay();
        }
      });

      window.addEventListener('load', attemptPlay);
    })();
  </script>
</body>
</html>
