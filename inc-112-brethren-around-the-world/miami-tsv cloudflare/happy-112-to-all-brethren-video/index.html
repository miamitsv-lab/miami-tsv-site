<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Full-Screen Video</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #000;
      font-family: Arial, Helvetica, sans-serif;
    }

    .player {
      position: fixed;
      inset: 0;
      width: 100vw;
      height: 100dvh;
      background: #000;
    }

    video {
      display: block;
      width: 100%;
      height: 100%;
      object-fit: contain;
      background: #000;
    }

    .fullscreen-button {
      position: absolute;
      right: max(18px, env(safe-area-inset-right));
      bottom: max(18px, env(safe-area-inset-bottom));
      min-height: 44px;
      padding: 10px 16px;
      border: 1px solid rgba(255, 255, 255, 0.45);
      border-radius: 999px;
      background: rgba(0, 0, 0, 0.65);
      color: #fff;
      font-size: 15px;
      font-weight: 700;
      cursor: pointer;
      z-index: 2;
      transition: opacity 250ms ease, background 250ms ease;
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
    }

    .player.hide-control .fullscreen-button {
      opacity: 0;
      pointer-events: none;
    }

    .fullscreen-button:hover,
    .fullscreen-button:focus-visible {
      background: rgba(255, 255, 255, 0.18);
      outline: 2px solid #fff;
      outline-offset: 2px;
    }

    @media (max-width: 560px) {
      .fullscreen-button {
        right: 50%;
        transform: translateX(50%);
        width: min(80vw, 190px);
        font-size: 14px;
      }
    }
  </style>
</head>
<body>
  <main class="player" id="player">
    <video
      id="video"
      src="video.mp4"
      autoplay
      muted
      loop
      playsinline
      preload="auto"
      aria-label="Full-screen silent video player"
    ></video>

    <button type="button" class="fullscreen-button" id="fullscreenButton">
      Enter Full Screen
    </button>
  </main>

  <script>
    const player = document.getElementById('player');
    const video = document.getElementById('video');
    const fullscreenButton = document.getElementById('fullscreenButton');
    let controlTimer;

    function showControl() {
      player.classList.remove('hide-control');
      clearTimeout(controlTimer);
      controlTimer = setTimeout(() => {
        if (!video.paused) player.classList.add('hide-control');
      }, 2500);
    }

    function updateFullscreenButton() {
      fullscreenButton.textContent = document.fullscreenElement
        ? 'Exit Full Screen'
        : 'Enter Full Screen';
    }

    async function toggleFullscreen() {
      try {
        if (!document.fullscreenElement) {
          await player.requestFullscreen();
        } else {
          await document.exitFullscreen();
        }
      } catch (error) {
        console.warn('Full-screen mode is unavailable:', error);
      }
    }

    fullscreenButton.addEventListener('click', toggleFullscreen);

    video.addEventListener('click', async () => {
      if (video.paused) {
        try { await video.play(); } catch (error) {}
      } else {
        video.pause();
      }
      showControl();
    });

    video.addEventListener('dblclick', toggleFullscreen);
    video.addEventListener('play', showControl);
    video.addEventListener('pause', showControl);
    document.addEventListener('fullscreenchange', updateFullscreenButton);
    document.addEventListener('mousemove', showControl);
    document.addEventListener('touchstart', showControl, { passive: true });

    document.addEventListener('keydown', async (event) => {
      if (event.code === 'Space') {
        event.preventDefault();
        if (video.paused) {
          try { await video.play(); } catch (error) {}
        } else {
          video.pause();
        }
      } else if (event.key.toLowerCase() === 'f') {
        toggleFullscreen();
      }
      showControl();
    });

    updateFullscreenButton();
    showControl();
  </script>
</body>
</html>
