<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#025E1A" />

  <title>Bulletin Board | Local Congregation of Miami</title>

  <style>
    :root {
      --green: #025E1A;
      --green-dark: #013d11;
      --red: #D6021A;
      --gold: #FEBA02;
      --white: #FFFFFF;
      --off-white: #F8FAF8;
      --text: #16321f;
      --shadow: 0 20px 50px rgba(0, 55, 20, 0.18);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      min-height: 100vh;
      min-height: 100svh;
      font-family: Arial, Helvetica, sans-serif;
      color: var(--text);
      background:
        radial-gradient(circle at 50% 10%, rgba(254, 186, 2, 0.16), transparent 30%),
        linear-gradient(135deg, #f4fff6 0%, #ffffff 48%, #fff6f6 100%);
      overflow-x: hidden;
    }

    .page-shell {
      min-height: 100vh;
      min-height: 100svh;
      position: relative;
      display: flex;
      flex-direction: column;
      isolation: isolate;
    }

    .page-shell::before,
    .page-shell::after {
      content: "";
      position: fixed;
      top: 0;
      bottom: 0;
      width: clamp(12px, 2vw, 28px);
      z-index: -1;
    }

    .page-shell::before {
      left: 0;
      background:
        linear-gradient(180deg, var(--green-dark), var(--green), #08752a);
      box-shadow: 6px 0 24px rgba(2, 94, 26, 0.2);
    }

    .page-shell::after {
      right: 0;
      background:
        linear-gradient(180deg, #9f0012, var(--red), #ef2940);
      box-shadow: -6px 0 24px rgba(214, 2, 26, 0.18);
    }

    .top-bar {
      width: 100%;
      height: 9px;
      background: linear-gradient(
        90deg,
        var(--green) 0 33.33%,
        var(--white) 33.33% 66.66%,
        var(--red) 66.66% 100%
      );
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.12);
    }

    header {
      width: min(1200px, calc(100% - clamp(44px, 6vw, 92px)));
      margin: 0 auto;
      padding: clamp(20px, 3vh, 36px) 0 10px;
      display: flex;
      justify-content: center;
      flex: 0 0 auto;
    }

    .district-label {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 14px;
      max-width: 100%;
      padding: 14px 28px;
      color: var(--green-dark);
      font-size: clamp(1rem, 1.4vw, 1.22rem);
      font-weight: 800;
      letter-spacing: 0.12em;
      line-height: 1.35;
      text-align: center;
      text-transform: uppercase;
      background: rgba(255, 255, 255, 0.86);
      border: 1px solid rgba(2, 94, 26, 0.13);
      border-radius: 999px;
      box-shadow: 0 8px 24px rgba(0, 65, 20, 0.08);
      backdrop-filter: blur(8px);
    }

    .district-label::before,
    .district-label::after {
      content: "";
      flex: 0 0 auto;
      width: 32px;
      height: 4px;
      border-radius: 999px;
    }

    .district-label::before {
      background: var(--green);
    }

    .district-label::after {
      background: var(--red);
    }

    main {
      flex: 1 1 auto;
      width: min(1200px, calc(100% - clamp(44px, 6vw, 92px)));
      min-height: 0;
      margin: 0 auto;
      padding: clamp(12px, 2vh, 24px) 0 clamp(16px, 2.5vh, 32px);
      display: grid;
      place-items: center;
    }

    .hero-card {
      position: relative;
      width: 100%;
      min-height: 640px;
      padding: clamp(62px, 7.8vw, 112px);
      display: grid;
      place-items: center;
      text-align: center;
      overflow: hidden;
      border-radius: clamp(26px, 3vw, 36px);
      background:
        linear-gradient(rgba(255, 255, 255, 0.92), rgba(255, 255, 255, 0.94)),
        repeating-linear-gradient(
          45deg,
          rgba(2, 94, 26, 0.04) 0 14px,
          rgba(214, 2, 26, 0.035) 14px 28px
        );
      border: 1px solid rgba(2, 94, 26, 0.13);
      box-shadow: var(--shadow);
    }

    .hero-card::before,
    .hero-card::after {
      content: "";
      position: absolute;
      border-radius: 50%;
      filter: blur(1px);
      opacity: 0.18;
      pointer-events: none;
    }

    .hero-card::before {
      width: clamp(300px, 34vw, 420px);
      height: clamp(300px, 34vw, 420px);
      left: clamp(-180px, -14vw, -120px);
      top: clamp(-180px, -14vw, -120px);
      background: var(--green);
    }

    .hero-card::after {
      width: clamp(300px, 34vw, 420px);
      height: clamp(300px, 34vw, 420px);
      right: clamp(-180px, -14vw, -120px);
      bottom: clamp(-180px, -14vw, -120px);
      background: var(--red);
    }

    .corner-accent {
      position: absolute;
      width: clamp(72px, 9vw, 110px);
      height: clamp(72px, 9vw, 110px);
      border-style: solid;
      border-width: 0;
      opacity: 0.95;
    }

    .corner-accent.top-left {
      top: clamp(18px, 2.4vw, 28px);
      left: clamp(18px, 2.4vw, 28px);
      border-top-width: 7px;
      border-left-width: 7px;
      border-color: var(--green);
      border-top-left-radius: 20px;
    }

    .corner-accent.bottom-right {
      right: clamp(18px, 2.4vw, 28px);
      bottom: clamp(18px, 2.4vw, 28px);
      border-right-width: 7px;
      border-bottom-width: 7px;
      border-color: var(--red);
      border-bottom-right-radius: 20px;
    }

    .hero-content {
      position: relative;
      z-index: 1;
      width: min(100%, 1120px);
    }

    h1 {
      font-size: clamp(5.8rem, 10.5vw, 10.2rem);
      line-height: 0.94;
      letter-spacing: -0.055em;
      color: var(--green-dark);
      text-wrap: balance;
    }

    h1 span {
      display: block;
      margin-top: 14px;
      color: var(--red);
    }

    .gold-line {
      width: min(470px, 80%);
      height: clamp(8px, 0.9vw, 12px);
      margin: clamp(32px, 4.2vh, 46px) auto;
      border-radius: 999px;
      background: linear-gradient(90deg, var(--green), var(--gold), var(--red));
      box-shadow: 0 5px 16px rgba(254, 186, 2, 0.25);
    }

    .congregation {
      font-family: Georgia, "Times New Roman", serif;
      font-size: clamp(2.2rem, 3.7vw, 3.35rem);
      font-weight: 700;
      line-height: 1.3;
      color: var(--text);
      text-wrap: balance;
    }

    .district {
      margin-top: 16px;
      font-size: clamp(1.4rem, 2.25vw, 1.82rem);
      font-weight: 800;
      letter-spacing: 0.08em;
      line-height: 1.45;
      text-transform: uppercase;
      color: var(--green);
    }

    .welcome-text {
      max-width: 900px;
      margin: clamp(24px, 3.4vh, 34px) auto 0;
      font-size: clamp(1.28rem, 1.9vw, 1.58rem);
      line-height: 1.7;
      color: #4b6252;
      text-wrap: balance;
    }

    footer {
      width: min(1200px, calc(100% - clamp(44px, 6vw, 92px)));
      margin: 0 auto;
      padding: 0 0 clamp(12px, 2vh, 22px);
      flex: 0 0 auto;
      text-align: center;
      font-size: clamp(1rem, 1.35vw, 1.14rem);
      line-height: 1.45;
      color: #5f7565;
    }

    .date-display {
      font-weight: 700;
      color: var(--green);
    }

    /* Desktop: 16:10 gives the content more comfortable vertical space. */
    @media (min-width: 1024px) {
      .hero-card {
        width: min(100%, calc((100svh - 145px) * 1.6));
        min-height: 620px;
        max-height: 900px;
        aspect-ratio: 16 / 10;
      }
    }

    /* Tablet portrait and smaller laptop widths. */
    @media (min-width: 769px) and (max-width: 1023px) {
      header,
      main,
      footer {
        width: min(92%, 900px);
      }

      .hero-card {
        min-height: 540px;
        aspect-ratio: 4 / 3;
        padding: clamp(44px, 7vw, 68px);
      }

      h1 {
        font-size: clamp(5.9rem, 14.5vw, 8.4rem);
      }
    }

    /* Tablet landscape. */
    @media (min-width: 769px) and (max-width: 1023px) and (orientation: landscape) {
      .hero-card {
        min-height: 470px;
        aspect-ratio: 3 / 2;
        padding-block: 38px;
      }

      h1 {
        font-size: clamp(5.4rem, 11.4vw, 7.5rem);
      }

      .gold-line {
        margin-block: 20px;
      }

      .welcome-text {
        margin-top: 18px;
      }
    }

    /* Mobile. */
    @media (max-width: 768px) {
      .page-shell::before,
      .page-shell::after {
        width: 10px;
      }

      header,
      main,
      footer {
        width: calc(100% - 34px);
      }

      header {
        padding-top: 16px;
      }

      .district-label {
        gap: 7px;
        padding: 8px 12px;
        font-size: clamp(0.84rem, 3.15vw, 1rem);
        letter-spacing: 0.08em;
      }

      .district-label::before,
      .district-label::after {
        width: 13px;
      }

      main {
        padding-top: 10px;
        padding-bottom: 20px;
      }

      .hero-card {
        width: 100%;
        min-height: max(590px, calc(100svh - 154px));
        padding: clamp(60px, 12vw, 80px) clamp(22px, 6.8vw, 40px);
        border-radius: 24px;
      }

      .corner-accent {
        width: 70px;
        height: 70px;
      }

      .corner-accent.top-left {
        top: 17px;
        left: 17px;
        border-top-width: 5px;
        border-left-width: 5px;
      }

      .corner-accent.bottom-right {
        right: 17px;
        bottom: 17px;
        border-right-width: 5px;
        border-bottom-width: 5px;
      }

      h1 {
        font-size: clamp(4.55rem, 20vw, 6.6rem);
      }

      .gold-line {
        margin: 22px auto;
      }

      .congregation {
        font-size: clamp(1.9rem, 7.5vw, 2.45rem);
      }

      .district {
        font-size: clamp(1.14rem, 4.4vw, 1.4rem);
      }

      .welcome-text {
        max-width: 520px;
        font-size: clamp(1.14rem, 4.1vw, 1.28rem);
        line-height: 1.6;
      }
    }

    @media (max-width: 430px) {
      .page-shell::before,
      .page-shell::after {
        width: 8px;
      }

      header,
      main,
      footer {
        width: calc(100% - 26px);
      }

      .district-label {
        width: 100%;
        border-radius: 16px;
      }

      .hero-card {
        min-height: max(570px, calc(100svh - 158px));
        padding: 56px 20px;
        border-radius: 21px;
      }

      h1 {
        font-size: clamp(4.1rem, 20.5vw, 5.7rem);
      }

      .congregation {
        font-size: 1.82rem;
      }

      .district {
        font-size: 1.12rem;
      }

      .welcome-text {
        font-size: 1.16rem;
      }

      footer {
        padding-bottom: 10px;
      }
    }

    /* Short desktop and tablet screens. */
    @media (min-width: 769px) and (max-height: 700px) {
      header {
        padding-top: 10px;
      }

      main {
        padding-block: 8px 14px;
      }

      .hero-card {
        min-height: 450px;
        padding-block: 34px;
      }

      h1 {
        font-size: clamp(5rem, 11.5vh, 7rem);
      }

      .gold-line {
        margin-block: 18px;
      }

      .welcome-text {
        margin-top: 16px;
        line-height: 1.55;
      }

      footer {
        padding-bottom: 8px;
      }
    }


    /*
      Viewport-fit safeguards:
      Keep the footer and all content visible when this page runs inside
      the full-screen carousel on desktop, tablet, and mobile.
    */
    html,
    body {
      width: 100%;
      height: 100%;
      min-height: 0;
      overflow: hidden;
    }

    body {
      min-height: 0;
    }

    .page-shell {
      width: 100%;
      height: 100vh;
      height: 100svh;
      min-height: 0;
      overflow: hidden;
    }

    .top-bar {
      flex: 0 0 auto;
    }

    header {
      padding-top: clamp(10px, 1.8svh, 22px);
      padding-bottom: clamp(4px, 0.8svh, 8px);
    }

    main {
      flex: 1 1 0;
      min-height: 0;
      padding-top: clamp(6px, 1svh, 12px);
      padding-bottom: clamp(6px, 1.1svh, 14px);
      overflow: hidden;
    }

    .hero-card {
      width: 100%;
      height: 100%;
      min-height: 0;
      max-height: 100%;
      aspect-ratio: auto;
      padding:
        clamp(26px, min(5.4vw, 6svh), 82px)
        clamp(20px, min(6vw, 7svh), 96px);
    }

    .hero-content {
      max-height: 100%;
    }

    h1 {
      font-size: clamp(3.8rem, min(10.5vw, 15svh), 10.2rem);
    }

    .gold-line {
      margin-top: clamp(18px, 3.2svh, 38px);
      margin-bottom: clamp(18px, 3.2svh, 38px);
    }

    .congregation {
      font-size: clamp(1.5rem, min(3.7vw, 4.8svh), 3.35rem);
    }

    .district {
      margin-top: clamp(8px, 1.4svh, 16px);
      font-size: clamp(1rem, min(2.25vw, 2.8svh), 1.82rem);
    }

    .welcome-text {
      margin-top: clamp(14px, 2.4svh, 30px);
      font-size: clamp(0.98rem, min(1.9vw, 2.25svh), 1.58rem);
      line-height: 1.55;
    }

    footer {
      min-height: 0;
      padding-top: clamp(2px, 0.4svh, 5px);
      padding-bottom: max(clamp(7px, 1.2svh, 14px), env(safe-area-inset-bottom));
      line-height: 1.25;
    }

    @media (min-width: 1024px) {
      .hero-card {
        width: min(100%, 1440px);
        height: 100%;
        min-height: 0;
        max-height: 100%;
        aspect-ratio: auto;
      }
    }

    @media (max-width: 768px) {
      header {
        padding-top: clamp(8px, 1.4svh, 14px);
      }

      .district-label {
        padding: clamp(7px, 1.3svh, 10px) 12px;
        font-size: clamp(0.68rem, min(3vw, 1.8svh), 0.9rem);
      }

      main {
        padding-top: clamp(4px, 0.7svh, 8px);
        padding-bottom: clamp(5px, 0.8svh, 10px);
      }

      .hero-card {
        min-height: 0;
        height: 100%;
        padding:
          clamp(24px, 4.8svh, 48px)
          clamp(18px, 5.5vw, 34px);
      }

      h1 {
        font-size: clamp(3.4rem, min(20vw, 12svh), 6.2rem);
      }

      .gold-line {
        margin-top: clamp(15px, 2.5svh, 24px);
        margin-bottom: clamp(15px, 2.5svh, 24px);
      }

      .congregation {
        font-size: clamp(1.35rem, min(7vw, 4.2svh), 2.35rem);
      }

      .district {
        font-size: clamp(0.88rem, min(4.2vw, 2.5svh), 1.3rem);
      }

      .welcome-text {
        margin-top: clamp(12px, 2svh, 20px);
        font-size: clamp(0.9rem, min(4vw, 2.2svh), 1.18rem);
        line-height: 1.48;
      }

      footer {
        font-size: clamp(0.76rem, min(3.2vw, 1.75svh), 1rem);
      }
    }

    @media (max-height: 650px) {
      .district-label {
        padding-block: 6px;
      }

      .hero-card {
        padding-top: 22px;
        padding-bottom: 22px;
      }

      h1 {
        font-size: clamp(3.25rem, min(17vw, 11svh), 5.4rem);
      }

      .gold-line {
        margin-top: 12px;
        margin-bottom: 12px;
      }

      .welcome-text {
        margin-top: 10px;
        line-height: 1.4;
      }

      footer {
        padding-bottom: 5px;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      html {
        scroll-behavior: auto;
      }
    }
  </style>
</head>

<body>
  <div class="page-shell">
    <div class="top-bar" aria-hidden="true"></div>

    <header>
      <div class="district-label">
        Iglesia Ni Cristo • Church Of Christ
      </div>
    </header>

    <main>
      <section class="hero-card" aria-labelledby="page-title">
        <span class="corner-accent top-left" aria-hidden="true"></span>
        <span class="corner-accent bottom-right" aria-hidden="true"></span>

        <div class="hero-content">
          <h1 id="page-title">
            Bulletin
            <span>Board</span>
          </h1>

          <div class="gold-line" aria-hidden="true"></div>

          <p class="congregation">Local Congregation of Miami</p>
          <p class="district">District of Florida &amp; Caribbean</p>

          <p class="welcome-text">
            Stay informed about congregation announcements, upcoming activities,
            schedules, reminders, and other important local updates.
          </p>
        </div>
      </section>
    </main>

    <footer>
      <span class="date-display" id="currentDate"></span>
      &nbsp;•&nbsp; Local Congregation of Miami
    </footer>
  </div>

  <script>
    const dateElement = document.getElementById("currentDate");

    if (dateElement) {
      dateElement.textContent = new Intl.DateTimeFormat("en-US", {
        weekday: "long",
        month: "long",
        day: "numeric",
        year: "numeric"
      }).format(new Date());
    }

    document.querySelectorAll('a[href^="#"]').forEach((link) => {
      link.addEventListener("click", (event) => {
        const targetId = link.getAttribute("href");

        if (!document.querySelector(targetId)) {
          event.preventDefault();
        }
      });
    });
  </script>
</body>
</html>
