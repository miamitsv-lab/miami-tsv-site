<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CFO Videoke – Full Poster Visible</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      width: 100%;
      min-height: 100%;
      background: #000;
      font-family: Arial, Helvetica, sans-serif;
      overflow-x: hidden;
    }
    body {
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .wrap {
      width: 100%;
      min-height: 100vh;
      min-height: 100svh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #000;
    }
    picture {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 100%;
      height: 100%;
    }
    img {
      display: block;
      width: 100%;
      height: auto;
      max-width: 100%;
      max-height: 100vh;
      max-height: 100svh;
      object-fit: contain;
      background: #000;
    }
  </style>
</head>
<body>
  <main class="wrap">
    <picture>
      <source media="(max-width: 599px)" srcset="cfo-videoke-mobile.png" />
      <source media="(max-width: 1023px)" srcset="cfo-videoke-tablet.png" />
      <img src="cfo-videoke-desktop.png" alt="CFO Videoke Guarding Night Edition poster" />
    </picture>
  </main>
</body>
</html>
