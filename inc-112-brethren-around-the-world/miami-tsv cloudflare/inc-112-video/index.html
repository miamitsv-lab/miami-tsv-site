<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>INC 112th Anniversary</title>
  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      background: #000;
    }

    .video-page {
      width: 100vw;
      height: 100dvh;
      display: grid;
      place-items: center;
      background: #000;
    }

    video {
      display: block;
      width: 100%;
      height: 100%;
      object-fit: contain;
      background: #000;
    }
  </style>
</head>
<body>
  <main class="video-page">
    <video
      id="inc112Video"
      autoplay
      muted
      loop
      playsinline
      preload="auto"
      aria-label="112th Anniversary video"
    >
      <source src="inc-112-video.mp4" type="video/mp4" />
      Your browser does not support HTML5 video.
    </video>
  </main>

  <script>
    const video = document.getElementById('inc112Video');

    // Helps playback resume if a browser temporarily interrupts autoplay.
    const startVideo = () => {
      video.play().catch(() => {
        // Muted autoplay is supported by modern browsers; no action is needed
        // if a browser still requires user interaction.
      });
    };

    window.addEventListener('load', startVideo);
    document.addEventListener('visibilitychange', () => {
      if (!document.hidden) startVideo();
    });
  </script>
</body>
</html>
