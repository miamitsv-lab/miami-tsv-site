<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#045c3d">
  <title>Anniversary Thanksgiving | Photo Sharing</title>
  <style>
    :root {
      --inc-green: #045c3d;
      --inc-green-deep: #003f2c;
      --inc-green-light: #77b947;
      --inc-red: #cf202f;
      --inc-red-deep: #9e1623;
      --inc-gold: #f2ac16;
      --ink: #073e42;
      --paper: #ffffff;
      --shadow: 0 22px 60px rgba(0, 63, 44, 0.16);
    }

    * { box-sizing: border-box; }
    html, body { margin: 0; min-height: 100%; }

    body {
      min-height: 100svh;
      overflow-x: hidden;
      font-family: Arial, Helvetica, sans-serif;
      color: var(--ink);
      background: radial-gradient(circle at 50% 20%, #ffffff 0%, #fffdf7 52%, #f3efe3 100%);
    }

    body::before,
    body::after {
      content: "";
      position: fixed;
      inset-block: 0;
      z-index: -2;
      width: clamp(48px, 8vw, 150px);
      pointer-events: none;
    }

    body::before {
      left: 0;
      background:
        linear-gradient(168deg, rgba(255,255,255,.18) 0 18%, transparent 18% 100%),
        linear-gradient(115deg, var(--inc-green-deep), var(--inc-green) 56%, var(--inc-green-light));
      clip-path: polygon(0 0, 100% 0, 54% 36%, 72% 58%, 38% 79%, 100% 100%, 0 100%);
      border-right: 3px solid var(--inc-gold);
    }

    body::after {
      right: 0;
      background:
        linear-gradient(195deg, rgba(255,255,255,.12) 0 19%, transparent 19% 100%),
        linear-gradient(245deg, var(--inc-red-deep), var(--inc-red) 58%, #f03a2f);
      clip-path: polygon(0 0, 100% 0, 100% 100%, 0 100%, 38% 74%, 12% 48%, 48% 30%);
      border-left: 3px solid var(--inc-gold);
    }

    .page {
      width: min(1760px, calc(100% - clamp(42px, 12vw, 260px)));
      min-height: 100svh;
      margin-inline: auto;
      padding: clamp(18px, 3vw, 48px) 0;
      display: grid;
      place-items: center;
    }

    .layout {
      width: 100%;
      display: grid;
      grid-template-columns: minmax(0, 1.1fr) minmax(360px, .7fr);
      gap: clamp(22px, 3vw, 52px);
      align-items: center;
    }

    .banner-panel {
      position: relative;
      overflow: hidden;
      border-radius: clamp(18px, 2vw, 34px);
      background: rgba(255,255,255,.96);
      box-shadow: var(--shadow);
      border: 1px solid rgba(4, 92, 61, 0.12);
      isolation: isolate;
      padding: clamp(14px, 1.8vw, 24px);
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: clamp(420px, 72vh, 980px);
    }

    .banner-panel::after {
      content: "";
      position: absolute;
      inset: 0;
      pointer-events: none;
      box-shadow: inset 0 0 0 2px rgba(242, 172, 22, 0.32);
      border-radius: inherit;
    }

    .banner-panel img {
      display: block;
      width: 100%;
      max-width: 760px;
      max-height: calc(100svh - 110px);
      height: auto;
      object-fit: contain;
    }

    .qr-card {
      position: relative;
      overflow: hidden;
      border-radius: clamp(22px, 2.2vw, 38px);
      padding: clamp(24px, 3vw, 44px);
      background: rgba(255, 255, 255, 0.96);
      border: 3px solid var(--inc-gold);
      box-shadow: var(--shadow);
      text-align: center;
    }

    .qr-card::before {
      content: "";
      position: absolute;
      inset: 0 0 auto 0;
      height: 10px;
      background: linear-gradient(90deg,
        var(--inc-green) 0 31%,
        #ffffff 31% 36%,
        var(--inc-gold) 36% 64%,
        #ffffff 64% 69%,
        var(--inc-red) 69% 100%);
    }

    h1 {
      margin: 0;
      color: var(--inc-green-deep);
      font-family: Georgia, "Times New Roman", serif;
      font-size: clamp(2rem, 3vw, 3.35rem);
      line-height: 1.02;
      text-wrap: balance;
    }

    h1 span { color: var(--inc-red); }

    .mobile-pill {
      display: inline-block;
      text-decoration: none;
      width: fit-content;
      margin: clamp(15px, 2vw, 24px) auto 18px;
      padding: .62rem 1.28rem;
      border-radius: 999px;
      color: white;
      background: var(--inc-green);
      font-weight: 800;
      letter-spacing: .14em;
      text-transform: uppercase;
      font-size: clamp(.8rem, 1vw, .96rem);
      box-shadow: 0 8px 18px rgba(4, 92, 61, .18);
      transition: transform .2s ease, box-shadow .2s ease, background-color .2s ease;
    }

    .mobile-pill:hover,
    .mobile-pill:focus-visible {
      transform: translateY(-2px);
      background: var(--inc-green-deep);
      box-shadow: 0 12px 24px rgba(4, 92, 61, .25);
      outline: 3px solid rgba(242, 172, 22, .55);
      outline-offset: 3px;
    }

    .qr-link {
      display: block;
      width: min(100%, 320px);
      margin-inline: auto;
      border-radius: 26px;
      text-decoration: none;
      transition: transform .2s ease, box-shadow .2s ease;
    }

    .qr-link:hover,
    .qr-link:focus-visible {
      transform: translateY(-3px) scale(1.01);
      outline: 3px solid rgba(242, 172, 22, .7);
      outline-offset: 5px;
    }

    .qr-frame {
      width: 100%;
      margin-inline: auto;
      padding: clamp(10px, 1.2vw, 16px);
      border-radius: 26px;
      background: #000;
      box-shadow: 0 16px 34px rgba(0, 0, 0, .2);
    }

    .qr-frame img {
      display: block;
      width: 100%;
      height: auto;
      aspect-ratio: 1 / 1;
      object-fit: contain;
      border-radius: 16px;
    }

    @media (max-width: 980px) {
      .page {
        width: min(920px, calc(100% - clamp(54px, 15vw, 140px)));
        padding-block: 28px;
      }

      .layout {
        grid-template-columns: 1fr;
        gap: 24px;
      }

      .banner-panel {
        order: 1;
        min-height: 0;
      }

      .qr-card { order: 2; }

      .banner-panel img {
        max-width: min(100%, 640px);
        max-height: none;
      }
    }

    @media (max-width: 560px) {
      body::before,
      body::after {
        width: 34px;
        border-width: 2px;
      }

      .page {
        width: calc(100% - 54px);
        padding-block: 16px 24px;
      }

      .layout { gap: 16px; }

      .banner-panel {
        border-radius: 14px;
        padding: 10px;
      }

      .qr-card {
        border-width: 2px;
        border-radius: 20px;
        padding: 22px 16px 24px;
      }

      .qr-link { width: min(78vw, 320px); border-radius: 20px; }
      .qr-frame { border-radius: 20px; }
      .qr-frame img { border-radius: 12px; }
    }

    @media (orientation: landscape) and (max-height: 660px) and (min-width: 740px) {
      .page { padding-block: 14px; }
      .layout { grid-template-columns: 1.15fr .85fr; gap: 20px; }
      .banner-panel { min-height: 0; }
      .banner-panel img { max-height: calc(100svh - 70px); max-width: 520px; }
      .qr-card { padding: 20px; }
      .mobile-pill { margin-block: 10px 14px; }
      .qr-link { width: min(34vh, 250px); }
    }

    @media (prefers-reduced-motion: no-preference) {
      .banner-panel, .qr-card {
        animation: rise .65s ease both;
      }
      .qr-card { animation-delay: .1s; }
      @keyframes rise {
        from { opacity: 0; transform: translateY(14px); }
        to { opacity: 1; transform: translateY(0); }
      }
    }
  </style>
</head>
<body>
  <main class="page">
    <section class="layout" aria-label="Anniversary Thanksgiving photo sharing">
      <div class="banner-panel">
        <img
          src="assets/anniversary-center-graphic.png"
          alt="112 Years Iglesia Ni Cristo Anniversary Thanksgiving graphic"
        >
      </div>

      <aside class="qr-card">
        <h1>Share Your <span>Photos</span></h1>
        <a
          class="mobile-pill"
          href="https://photos.app.goo.gl/mzv1zWyCxve4fhhq8"
          target="_blank"
          rel="noopener noreferrer"
        >Mobile Upload</a>

        <a
          class="qr-link"
          href="https://photos.app.goo.gl/mzv1zWyCxve4fhhq8"
          target="_blank"
          rel="noopener noreferrer"
          aria-label="Open the Google Photos upload page"
        >
          <div class="qr-frame">
            <img src="assets/google-drv-qr-code.png" alt="QR code for photo upload">
          </div>
        </a>
      </aside>
    </section>
  </main>
</body>
</html>
