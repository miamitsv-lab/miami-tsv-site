<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#ffffff">
  <meta name="color-scheme" content="light only">

  <title>112th Anniversary Thanksgiving</title>
  <meta
    name="description"
    content="Iglesia Ni Cristo 112th Anniversary Thanksgiving responsive landing page."
  >

  <!-- Preload only the image appropriate for the current viewport. -->
  <link
    rel="preload"
    as="image"
    href="assets/112-anniversary-mobile.png"
    media="(max-width: 767px)"
    fetchpriority="high"
  >
  <link
    rel="preload"
    as="image"
    href="assets/112-anniversary-desktop.png"
    media="(min-width: 768px)"
    fetchpriority="high"
  >

  <link rel="stylesheet" href="styles.css">
  <script src="script.js" defer></script>
</head>
<body>
  <main class="hero" aria-label="112th Anniversary Thanksgiving">
    <!--
      A real responsive image is used instead of CSS background-image so the
      browser can select, preload, and decode the correct file efficiently.
      It still behaves visually like a full-page background.
    -->
    <picture class="hero__background" aria-hidden="true">
      <source
        media="(max-width: 767px)"
        srcset="assets/112-anniversary-mobile.png"
      >
      <img
        id="heroBackground"
        src="assets/112-anniversary-desktop.png"
        alt=""
        width="1672"
        height="941"
        decoding="async"
        fetchpriority="high"
      >
    </picture>

    <!-- Optional overlay area for a countdown, buttons, or event details. -->
    <section class="hero__overlay" aria-live="polite">
      <div id="countdown" class="countdown" hidden>
        <p class="countdown__label">Anniversary countdown</p>
        <div class="countdown__grid" aria-label="Time remaining">
          <div class="countdown__unit">
            <span id="days" class="countdown__value">00</span>
            <span class="countdown__name">Days</span>
          </div>
          <div class="countdown__unit">
            <span id="hours" class="countdown__value">00</span>
            <span class="countdown__name">Hours</span>
          </div>
          <div class="countdown__unit">
            <span id="minutes" class="countdown__value">00</span>
            <span class="countdown__name">Minutes</span>
          </div>
          <div class="countdown__unit">
            <span id="seconds" class="countdown__value">00</span>
            <span class="countdown__name">Seconds</span>
          </div>
        </div>
      </div>
    </section>

    <noscript>
      <p class="no-script">JavaScript is disabled. The responsive background still works.</p>
    </noscript>
  </main>
</body>
</html>
