<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#ffffff" />
  <title>112 Years — Iglesia Ni Cristo</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html,
    body {
      width: 100%;
      min-height: 100%;
      background: #ffffff;
    }

    body {
      overflow: hidden;
      font-family: Arial, Helvetica, sans-serif;
    }

    .poster-page {
      width: 100vw;
      height: 100vh;
      height: 100svh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #ffffff;
      overflow: hidden;
      padding: 0;
    }

    .poster-picture {
      width: 100%;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .poster-image {
      display: block;
      width: 100%;
      height: 100%;
      object-fit: contain;
      object-position: center;
      background: #ffffff;
    }

    /* Mobile */
    @media (max-width: 767px) {
      .poster-page {
        padding: 0;
      }
    }

    /* Tablet */
    @media (min-width: 768px) and (max-width: 1199px) {
      .poster-page {
        padding: 0;
      }
    }

    /* Desktop */
    @media (min-width: 1200px) {
      .poster-page {
        padding: 0;
      }
    }
  </style>
</head>
<body>
  <main class="poster-page">
    <picture class="poster-picture">
      <source
        media="(max-width: 767px)"
        srcset="inc-112-emblem-mobile.png"
      />

      <source
        media="(max-width: 1199px)"
        srcset="inc-112-emblem-tablet.png"
      />

      <img
        class="poster-image"
        src="inc-112-emblem-desktop.png"
        alt="Stand firm in the faith. Our salvation is at hand. Iglesia Ni Cristo 112 Years, 1914 to 2026."
        width="1672"
        height="941"
        decoding="async"
        fetchpriority="high"
      />
    </picture>
  </main>
</body>
</html>
