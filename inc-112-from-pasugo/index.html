<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Full-Screen Video</title>
  <style>
    :root { color-scheme: dark; }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #000;
      font-family: Arial, Helvetica, sans-serif;
    }

    .player {
      position: fixed;
      inset: 0;
      width: 100vw;
      height: 100dvh;
      background: #000;
    }

    video {
      display: block;
      width: 100%;
      height: 100%;
      object-fit: contain;
      background: #000;
    }

    .controls {
      position: absolute;
      right: max(18px, env(safe-area-inset-right));
      bottom: max(18px, env(safe-area-inset-bottom));
      display: flex;
      gap: 10px;
      z-index: 2;
      transition: opacity 250ms ease;
    }

    .player.hide-controls .controls {
      opacity: 0;
      pointer-events: none;
    }

    button {
      min-height: 44px;
      padding: 10px 16px;
      border: 1px solid rgba(255, 255, 255, 0.45);
      border-radius: 999px;
      background: rgba(0, 0, 0, 0.65);
      color: #fff;
      font-size: 15px;
      font-weight: 700;
      cursor: pointer;
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
    }

    button:hover,
    button:focus-visible {
      background: rgba(255, 255, 255, 0.18);
      outline: 2px solid #fff;
      outline-offset: 2px;
    }

    @media (max-width: 560px) {
      .controls {
        left: max(12px, env(safe-area-inset-left));
        right: max(12px, env(safe-area-inset-right));
        justify-content: center;
      }

      button {
        flex: 1;
        max-width: 170px;
        font-size: 14px;
      }
    }
  </style>
</head>
<body>
  <main class="player" id="player">
    <video
      id="video"
      src="video.mp4"
      autoplay
      muted
      loop
      playsinline
      preload="auto"
      aria-label="Full-screen video player"
    ></video>

    <div class="controls" id="controls">
      <button type="button" id="soundButton">Turn Sound On</button>
      <button type="button" id="fullscreenButton">Enter Full Screen</button>
    </div>
  </main>

  <script>
    const player = document.getElementById('player');
    const video = document.getElementById('video');
    const soundButton = document.getElementById('soundButton');
    const fullscreenButton = document.getElementById('fullscreenButton');

    let controlsTimer;

    function showControls() {
      player.classList.remove('hide-controls');
      clearTimeout(controlsTimer);
      controlsTimer = setTimeout(() => {
        if (!video.paused) player.classList.add('hide-controls');
      }, 2500);
    }

    function updateSoundButton() {
      soundButton.textContent = video.muted ? 'Turn Sound On' : 'Mute';
    }

    function updateFullscreenButton() {
      fullscreenButton.textContent = document.fullscreenElement
        ? 'Exit Full Screen'
        : 'Enter Full Screen';
    }

    async function toggleFullscreen() {
      try {
        if (!document.fullscreenElement) {
          await player.requestFullscreen();
        } else {
          await document.exitFullscreen();
        }
      } catch (error) {
        console.warn('Full-screen mode was not available:', error);
      }
    }

    soundButton.addEventListener('click', async () => {
      video.muted = !video.muted;
      updateSoundButton();
      try { await video.play(); } catch (error) {}
      showControls();
    });

    fullscreenButton.addEventListener('click', toggleFullscreen);

    video.addEventListener('click', async () => {
      if (video.paused) {
        try { await video.play(); } catch (error) {}
      } else {
        video.pause();
      }
      showControls();
    });

    video.addEventListener('dblclick', toggleFullscreen);
    video.addEventListener('play', showControls);
    video.addEventListener('pause', showControls);
    document.addEventListener('fullscreenchange', updateFullscreenButton);
    document.addEventListener('mousemove', showControls);
    document.addEventListener('touchstart', showControls, { passive: true });

    document.addEventListener('keydown', async (event) => {
      if (event.code === 'Space') {
        event.preventDefault();
        if (video.paused) {
          try { await video.play(); } catch (error) {}
        } else {
          video.pause();
        }
      } else if (event.key.toLowerCase() === 'f') {
        toggleFullscreen();
      } else if (event.key.toLowerCase() === 'm') {
        video.muted = !video.muted;
        updateSoundButton();
      }
      showControls();
    });

    updateSoundButton();
    updateFullscreenButton();
    showControls();
  </script>
</body>
</html>
